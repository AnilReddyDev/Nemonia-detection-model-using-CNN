<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pneumonia X-ray Classifier</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <div class="copy">
          <p class="eyebrow">Chest X-ray AI</p>
          <h1>Pneumonia Classifier</h1>
          <p class="summary">Upload a chest X-ray image and the trained CNN will predict whether it is normal or pneumonia-positive.</p>
        </div>

        <form id="upload-form" class="upload-panel">
          <label class="drop-zone" for="xray-file">
            <span id="file-name">Choose an X-ray image</span>
            <input id="xray-file" name="file" type="file" accept="image/*" required />
          </label>
          <button type="submit">Predict</button>
        </form>

        <section id="result" class="result" aria-live="polite"></section>
      </section>
    </main>

    <script src="/static/script.js"></script>
  </body>
</html>
